<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Premios</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#14110c;--card:#1f1a12;--tx:#f3ead9;--mu:#a89a84;--ac:#e6b94a;--ac2:#3a2f14;--bd:#38301f}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#2a2112,var(--bg) 60%) fixed;color:var(--tx);font:16px/1.5 Georgia,'Times New Roman',serif}
main{max-width:720px;margin:0 auto;padding:24px 16px 64px}
header{text-align:center;margin-bottom:20px}
h1{font-size:2.4rem;margin:.2em 0;color:var(--ac);letter-spacing:.06em;text-transform:uppercase}
.sub{color:var(--mu);margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:14px 0}
.card h2{margin:0 0 10px;font-size:1.15rem;color:var(--ac)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 12px;margin:6px 0;border:1px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx);font:inherit;cursor:pointer;position:relative;overflow:hidden;min-height:48px}
.opt.sel{border-color:var(--ac);background:var(--ac2);font-weight:bold}
.opt img{width:64px;height:64px;object-fit:cover;border-radius:10px;position:relative;z-index:1}
.opt .bar{position:absolute;left:0;top:0;bottom:0;background:var(--ac2)}
.opt span{position:relative;z-index:1}.opt .n{margin-left:auto;color:var(--mu);white-space:nowrap}
.pri{background:var(--ac);color:#1a1405;border:0;border-radius:10px;padding:12px 20px;font:inherit;font-weight:bold;cursor:pointer}
.sec{background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
.x{background:none;border:0;color:#e06050;cursor:pointer;font-size:1.1rem}
input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.bar-top{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.ctr{text-align:center;margin-top:18px}.mu{color:var(--mu);font-size:.9rem}
.thumb,.ph{width:48px;height:48px;border-radius:8px;border:1px solid var(--bd);object-fit:cover;cursor:pointer;flex:none}
.ph{display:flex;align-items:center;justify-content:center;border-style:dashed}
</style></head><body><main>
<div class="bar-top" id="admin"></div>
<header><h1 id="title"></h1><p class="sub" id="subtitle"></p></header>
<div id="app"><p class="ctr mu">Cargando…</p></div>
<p class="ctr mu" id="foot"></p>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,setDoc,onSnapshot,collection,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ====== PEGA AQUÍ TU firebaseConfig (sustituye todo este bloque) ====== */
const FIREBASE = {
  apiKey: "AIzaSyDpR1MgT63h3GC89i3vsRDOb28sTHzzcgI",
  authDomain: "premios-boluda-d1b17.firebaseapp.com",
  projectId: "premios-boluda-d1b17",
  storageBucket: "premios-boluda-d1b17.firebasestorage.app",
  messagingSenderId: "887794054168",
  appId: "1:887794054168:web:3790fd0d111e43fb467f6d"
};
/* ===================================================================== */

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,8);
const W=o=>Object.assign(window,o);
let cfg={title:'Premios',subtitle:'',cats:[]},votes=[],user=null,mode='vote',mine={},voter='',voted=false;
try{voted=!!localStorage.getItem('votado');}catch(e){}
if(FIREBASE.apiKey==='PEGA_AQUI'){$('#app').innerHTML='<p class="ctr">Falta pegar tu firebaseConfig en el archivo (sigue la guía).</p>';throw new Error('config');}

const app=initializeApp(FIREBASE),db=getFirestore(app),auth=getAuth(app);
onSnapshot(doc(db,'config','main'),s=>{if(s.exists())cfg=s.data();if(mode!=='edit')render();},()=>{});
onAuthStateChanged(auth,u=>{
  user=u;render();
  if(u)onSnapshot(collection(db,'votes'),s=>{votes=s.docs.map(d=>d.data());if(mode==='count')renderCount();},()=>{});
});

function render(){
  $('#title').textContent=cfg.title||'Premios';$('#subtitle').textContent=cfg.subtitle||'';
  $('#admin').innerHTML=user?'<button class="sec" onclick="setMode(\'vote\')">👁 Vista de voto</button><button class="sec" onclick="setMode(\'edit\')">✏️ Editar</button><button class="sec" onclick="setMode(\'count\')">📊 Resultados</button>'+(mode==='edit'?'<button class="pri" onclick="save()">💾 Guardar</button>':'')+'<button class="sec" onclick="signOut_()">Salir</button>':'';
  $('#foot').innerHTML=user?'':'<a href="#" onclick="login();return false" style="color:inherit">Soy el organizador</a>';
  if(mode==='edit'&&user)return renderEdit();
  if(mode==='count'&&user)return renderCount();
  renderVote();
}
W({setMode:m=>{if(mode==='edit')sync();mode=m;render();},
  login:()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>alert('No se pudo entrar: '+e.code+'\nRevisa que tu dominio esté en Authentication → Configuración → Dominios autorizados.')),
  signOut_:()=>{mode='vote';signOut(auth);}});

/* ---------- votar ---------- */
function renderVote(){
  if(voted&&!user){$('#app').innerHTML='<div class="card ctr"><h2>¡Gracias por votar! 🏆</h2><p class="mu">Tu voto ya está registrado.</p></div>';return;}
  if(!cfg.cats.length){$('#app').innerHTML='<p class="ctr mu">Aún no hay categorías. Vuelve pronto.</p>';return;}
  $('#app').innerHTML='<div class="card"><input type="text" placeholder="Tu nombre" value="'+esc(voter)+'" oninput="voter_(this.value)"></div>'+
  cfg.cats.map(c=>'<div class="card"><h2>🏆 '+esc(c.name)+'</h2>'+c.noms.map(n=>'<button class="opt'+(mine[c.id]===n.i?' sel':'')+'" onclick="pick(\''+c.id+'\',\''+n.i+'\')">'+(n.img?'<img src="'+n.img+'">':'')+'<span>'+(mine[c.id]===n.i?'✓ ':'')+esc(n.t)+'</span></button>').join('')+'</div>').join('')+
  '<div class="ctr"><button class="pri" onclick="send()">Enviar mis votos</button></div>';
}
W({voter_:v=>voter=v,pick:(c,n)=>{mine[c]=n;renderVote();},
  send:async()=>{
    const slug=voter.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60);
    if(!slug){alert('Pon tu nombre arriba.');return;}
    const miss=cfg.cats.filter(c=>!mine[c.id]).length;
    if(miss&&!confirm('Te faltan '+miss+' premios por votar. ¿Enviar igualmente?'))return;
    try{await setDoc(doc(db,'votes',slug),{n:voter.trim(),v:mine,t:Date.now()});
      voted=true;try{localStorage.setItem('votado','1');}catch(e){}render();}
    catch(e){alert(e.code==='permission-denied'?'Ya hay un voto con ese nombre. Si eres otra persona, añade tu apellido.':'No se pudo enviar el voto. Inténtalo otra vez.');}
  }});

/* ---------- resultados ---------- */
function renderCount(){
  $('#app').innerHTML='<p class="ctr mu">'+votes.length+' votante'+(votes.length==1?'':'s')+(votes.length?': '+esc(votes.map(v=>v.n).join(', ')):'')+'</p>'+
  cfg.cats.map(c=>{
    const k={};votes.forEach(v=>{const x=v.v&&v.v[c.id];if(x)k[x]=(k[x]||0)+1;});
    const tot=Object.values(k).reduce((a,b)=>a+b,0),max=Math.max(0,...Object.values(k));
    return '<div class="card"><h2>🏆 '+esc(c.name)+'</h2>'+c.noms.map(n=>{const q=k[n.i]||0,p=tot?Math.round(q/tot*100):0;
      return '<div class="opt'+(q&&q===max?' sel':'')+'"><div class="bar" style="width:'+p+'%"></div>'+(n.img?'<img src="'+n.img+'">':'')+'<span>'+(q&&q===max?'👑 ':'')+esc(n.t)+'</span><span class="n">'+q+' · '+p+'%</span></div>';}).join('')+'</div>';
  }).join('')+'<div class="ctr"><button class="sec" onclick="resetVotes()">Borrar todos los votos</button></div>';
}
W({resetVotes:async()=>{
  if(!confirm('¿Borrar TODOS los votos? No se puede deshacer.'))return;
  const slugs=votes.map(v=>v.n.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60));
  try{await Promise.all(slugs.map(s=>deleteDoc(doc(db,'votes',s))));}catch(e){alert('No se pudieron borrar.');}
}});

/* ---------- editar ---------- */
function sync(){
  if(!$('#e_t'))return;
  cfg.title=$('#e_t').value;cfg.subtitle=$('#e_s').value;
  document.querySelectorAll('[data-c]').forEach(i=>cfg.cats[+i.dataset.c].name=i.value);
  document.querySelectorAll('[data-n]').forEach(i=>{const[a,b]=i.dataset.n.split('.');cfg.cats[+a].noms[+b].t=i.value;});
}
function renderEdit(){
  $('#app').innerHTML='<div class="card"><h2>General</h2><div class="row"><input type="text" id="e_t" placeholder="Título" value="'+esc(cfg.title)+'"></div><div class="row"><input type="text" id="e_s" placeholder="Subtítulo" value="'+esc(cfg.subtitle)+'"></div></div>'+
  cfg.cats.map((c,i)=>'<div class="card"><div class="row"><input type="text" data-c="'+i+'" placeholder="Nombre del premio" value="'+esc(c.name)+'"><button class="x" onclick="del('+i+')">🗑</button></div>'+
  c.noms.map((n,j)=>'<div class="row">'+(n.img?'<img class="thumb" src="'+n.img+'" onclick="this.nextElementSibling.click()">':'<div class="ph" onclick="this.nextElementSibling.click()">🖼</div>')+'<input type="file" accept="image/*" hidden onchange="upImg('+i+','+j+',this)"><input type="text" data-n="'+i+'.'+j+'" placeholder="Nominado" value="'+esc(n.t)+'"><button class="x" onclick="delN('+i+','+j+')">✕</button></div>').join('')+
  '<button class="sec" onclick="addN('+i+')">+ Nominado</button></div>').join('')+
  '<div class="ctr"><button class="sec" onclick="addC()">+ Nuevo premio</button></div><p class="ctr mu">Pulsa “Guardar” arriba cuando termines.</p>';
}
W({addC:()=>{sync();cfg.cats.push({id:rid(),name:'',noms:[{i:rid(),t:''},{i:rid(),t:''}]});renderEdit();},
  del:i=>{sync();if(confirm('¿Borrar este premio?')){cfg.cats.splice(i,1);renderEdit();}},
  addN:i=>{sync();cfg.cats[i].noms.push({i:rid(),t:''});renderEdit();},
  delN:(i,j)=>{sync();cfg.cats[i].noms.splice(j,1);renderEdit();},
  upImg:async(i,j,inp)=>{
    const f=inp.files[0];if(!f)return;
    try{const bm=await createImageBitmap(f),s=Math.min(1,300/Math.max(bm.width,bm.height)),cv=document.createElement('canvas');
      cv.width=Math.round(bm.width*s);cv.height=Math.round(bm.height*s);cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);
      sync();cfg.cats[i].noms[j].img=cv.toDataURL('image/jpeg',.7);renderEdit();}
    catch(e){alert('No se pudo leer la imagen.');}
  },
  save:async()=>{
    sync();
    cfg.cats=cfg.cats.filter(c=>c.name.trim()).map(c=>({...c,noms:c.noms.filter(n=>n.t.trim())}));
    if(JSON.stringify(cfg).length>900000){alert('Hay demasiadas fotos (el límite es aprox. 900 KB). Quita alguna.');return;}
    try{await setDoc(doc(db,'config','main'),cfg);mode='vote';render();alert('Guardado ✓');}
    catch(e){alert(e.code==='permission-denied'?'Esta cuenta no es la del organizador (revisa el correo en las reglas).':'No se pudo guardar: '+e.code);}
  }});
</script></body></html>
